<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login · Tasmeem Hub</title><link rel="stylesheet" href="/css/app.css"></head>
<body><nav class="site-nav"><a class="brand" href="/"><img src="/css/images/logo.png" alt="Tasmeem Hub"><span>Tasmeem Hub</span></a><div class="nav-actions"><a class="btn-ghost btn-sm" href="/designers">Browse designers</a></div></nav>
<main class="form-card card pad"><div class="kicker">Welcome back</div><h1>Sign in</h1><p class="muted">Use the account you created as a client or designer.</p><div class="alert" th:if="${error}" th:text="${error}"></div>
<form class="form-grid" action="/login" method="post"><label>Email<input name="email" type="email" required th:value="${email}"></label><label>Password<input name="password" type="password" required></label><button class="btn-primary" type="submit">Sign in</button></form>
<p class="form-note" style="margin-top:16px">New to Tasmeem Hub? <a href="/signup">Create an account</a>.</p></main></body></html>
