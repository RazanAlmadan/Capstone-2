<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Matching · Tasmeem Hub</title><link rel="stylesheet" href="/css/app.css"></head>
<body><nav class="site-nav"><a class="brand" href="/"><img src="/css/images/logo.png" alt="Tasmeem Hub"><span>Tasmeem Hub</span></a><div class="nav-links"><a href="/designers">Designers</a><a href="/catalogs">Catalogs</a><a href="/ai">AI Matching</a><a href="/about">About</a></div></nav>
<main class="page section"><div class="ai-box"><div class="section-head"><div><div class="kicker">AI style matching</div><h2>Find designers by visual style</h2><p>Paste a publicly accessible image URL and let your existing Spring AI endpoint return matching designers.</p></div></div>
<div class="card pad"><form id="aiForm" class="form-grid"><label>Image URL<input id="imageUrl" type="url" placeholder="https://example.com/my-design.jpg" required></label><button class="btn-primary" type="submit">Analyze image</button></form><div id="aiResult" class="ai-result"></div></div></div></main>
<script src="/js/app.js"></script><script>
const form=document.getElementById('aiForm');const out=document.getElementById('aiResult');form.addEventListener('submit',async e=>{e.preventDefault();out.innerHTML='<div class="empty">Analyzing…</div>';try{const designers=await api('/api/v1/ai/find-designers-by-style?imageUrl='+encodeURIComponent(document.getElementById('imageUrl').value),{method:'POST'});if(!designers.length){out.innerHTML='<div class="empty">No matching designers were returned.</div>';return;}out.innerHTML='<div class="grid-3">'+designers.map(d=>'<article class="card designer-card"><img src="'+escapeHtml(d.profileImageUrl||'/css/images/Designer.png')+'" alt="Designer"><div class="content"><h3>'+escapeHtml(d.name)+'</h3><p class="meta">'+escapeHtml(d.visualField||'')+'</p><a class="btn-primary btn-sm" href="/designer/'+encodeURIComponent(d.id)+'">View profile</a></div></article>').join('')+'</div>';}catch(err){out.innerHTML='<div class="alert">'+escapeHtml(err.message)+'</div>';}});
</script></body></html>
