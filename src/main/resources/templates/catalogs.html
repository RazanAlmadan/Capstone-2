<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Catalogs · Tasmeem Hub</title><link rel="stylesheet" href="/css/app.css"></head>
<body><nav class="site-nav"><a class="brand" href="/"><img src="/css/images/logo.png" alt="Tasmeem Hub"><span>Tasmeem Hub</span></a><div class="nav-links"><a href="/designers">Designers</a><a href="/catalogs">Catalogs</a><a href="/ai">AI Matching</a><a href="/about">About</a></div></nav>
<main class="page section"><div class="section-head"><div><div class="kicker">Portfolio library</div><h2>Designer catalogs</h2><p>Browse example work from the designers in the marketplace.</p></div></div>
<div class="catalog-grid"><article class="card catalog-card" th:each="catalog : ${catalogs}" th:if="${catalog.images != null and !catalog.images.isEmpty()}"><div class="catalog-image-grid"><img th:each="image : ${catalog.images}" th:src="${image}" alt="Catalog image"></div><div class="content"><h3 th:text="${catalog.name}">Catalog</h3><a class="btn-ghost btn-sm" th:href="@{/designer/{id}(id=${catalog.designerId})}">View designer</a></div></article></div><div class="empty" th:if="${#lists.isEmpty(catalogs)}">No catalogs have been added yet.</div></main></body></html>
